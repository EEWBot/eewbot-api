name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Deployment remains opt-in and requires Cloudflare credentials. Production is
    # manual only and gated by the GitHub "production" environment's reviewers.
    if: >-
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event.inputs.environment == 'staging' ||
       github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Require production smoke credentials
        if: env.TARGET == 'production'
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: |
          test -n "$ACCESS_CLIENT_ID" || { echo 'Set production ACCESS_CLIENT_ID'; exit 1; }
          test -n "$ACCESS_CLIENT_SECRET" || { echo 'Set production ACCESS_CLIENT_SECRET'; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Apply D1 migrations
        run: npm run db:migrate:$TARGET
      - name: Deploy Worker
        run: npm run deploy:$TARGET
      - name: Smoke test selected environment
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: node scripts/smoke-api.mjs "$TARGET"
