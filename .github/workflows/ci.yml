name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Bootstrap a lockfile for the first PR. After committing package-lock.json,
      # this step should be deleted and npm ci used directly.
      - name: Generate initial lockfile
        run: npm install --package-lock-only
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
