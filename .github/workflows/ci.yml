name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  java-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: api
      - uses: actions/checkout@v7
        with:
          repository: EEWBot/EEWBot
          ref: a90a91a591cad1c2c72bd5f6b90f386205ca3d3f
          path: core
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle
      - name: Build the pinned Java Core reference
        working-directory: core
        run: bash ./gradlew test shadowJar --no-daemon
      - run: npm ci
        working-directory: api
      - name: Verify signed interactions through local D1 and the actual RevisionPoller
        working-directory: api
        run: npm run test:java
        env:
          EEWBOT_CORE_DIR: ${{ github.workspace }}/core
