name: Recover production Access credentials once

on:
  workflow_dispatch:

permissions: {}

jobs:
  recover:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Encrypt the saved production Access pair
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes, createCipheriv, publicEncrypt, constants } from 'node:crypto'
          const clientId = process.env.ACCESS_CLIENT_ID?.trim()
          const clientSecret = process.env.ACCESS_CLIENT_SECRET?.trim()
          if (!clientId || !clientSecret || /[\r\n]/.test(clientId + clientSecret)) {
            throw new Error('Missing or malformed production Access credentials')
          }
          const publicKey = Buffer.from('', 'base64').toString('utf8')
          const payload = Buffer.from(JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY,
            runId: process.env.GITHUB_RUN_ID,
            commit: process.env.GITHUB_SHA,
            EEWBOT_CF_ACCESS_CLIENT_ID: clientId,
            EEWBOT_CF_ACCESS_CLIENT_SECRET: clientSecret,
          }))
          const key = randomBytes(32)
          const iv = randomBytes(12)
          const cipher = createCipheriv('aes-256-gcm', key, iv)
          const data = Buffer.concat([cipher.update(payload), cipher.final()])
          const envelope = {
            version: 1,
            publicKeySha256: 'de8d87e1cbda0fe90a81506e056731c19a2f58976cfb042f03b05c4d92ab7b8b',
            key: publicEncrypt({ key: publicKey, oaepHash: 'sha256', padding: constants.RSA_PKCS1_OAEP_PADDING }, key).toString('base64'),
            iv: iv.toString('base64'),
            tag: cipher.getAuthTag().toString('base64'),
            data: data.toString('base64'),
          }
          key.fill(0)
          payload.fill(0)
          console.log('EEWBOT_ENCRYPTED_ACCESS_V1=' + Buffer.from(JSON.stringify(envelope)).toString('base64'))
          NODE
